<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3E9D8">
<title>Curry Club</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3E9D8;
    --panel:#FCF7EF;
    --panel-2:#EBDCC4;
    --line:#D9C6A6;
    --text:#2A1A2E;
    --muted:#8A7859;
    --turmeric:#D99A2B;
    --chilli:#C0472E;
    --coriander:#4C9E2C;
    --burgundy:#8E2B20;
    --link:#A85A14;

    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Figtree',system-ui,sans-serif;
    --radius:16px;
    --radius-sm:11px;
    --maxw:560px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15}
  a{color:var(--link)}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:18px 16px 96px}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:4px 2px 14px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-0.01em}
  .brand-logo{width:27px;height:27px;flex:none}
  .topbar .spacer{flex:1}
  .who{font-size:13px;color:var(--muted);text-align:right;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- buttons ---------- */
  button{font-family:inherit;cursor:pointer;border:none}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--text);color:var(--bg);font-weight:700;font-size:15px;
    padding:13px 18px;border-radius:var(--radius-sm);width:100%;
  }
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 14px;font-size:14px}
  .btn[disabled]{opacity:.55;cursor:default}

  .linkbtn{background:none;color:var(--burgundy);font:inherit;font-weight:600;text-decoration:underline;padding:0}

  /* ---------- cards & forms ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{
    width:100%;font-family:inherit;font-size:16px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 13px;
  }
  textarea{resize:vertical;min-height:72px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--turmeric);outline-offset:1px}

  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .sectiontitle{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 10px}

  /* ---------- messages ---------- */
  .msg{border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;margin-bottom:12px;display:none}
  .msg.show{display:block}
  .msg.error{background:#F7E3DD;border:1px solid var(--chilli);color:#7A2317}
  .msg.ok{background:#E7F2DB;border:1px solid var(--coriander);color:#2E5C15}

  /* ---------- ranking card ---------- */
  .venue{display:flex;gap:14px;align-items:center}
  .venue .body{flex:1;min-width:0}
  .venue h3{font-size:17px;margin-bottom:2px}
  .venue .area{font-size:13px;color:var(--muted)}
  .venue .meta{font-size:12.5px;color:var(--muted);margin-top:7px}
  .rank-no{font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:14px;width:22px;text-align:center;flex:none}

  /* score ring */
  .ring{position:relative;width:62px;height:62px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .ring .val b{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1}
  .ring .val span{font-size:9px;color:var(--muted);letter-spacing:.04em}

  /* meters */
  .meters{margin-top:12px;display:grid;gap:8px}
  .meter{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:9px}
  .meter .lbl{font-size:12.5px;color:var(--muted)}
  .meter .track{height:7px;background:var(--panel-2);border-radius:99px;overflow:hidden}
  .meter .fill{height:100%;border-radius:99px}
  .meter .num{font-size:12.5px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}

  .expand{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .visit-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .visit-row:last-child{border-bottom:none}
  .visit-row .d{color:var(--muted)}
  .pill{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--muted)}

  /* everyone's ratings on a visit */
  .visit-block{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .visit-block:first-child{border-top:none;margin-top:4px;padding-top:0}
  .visit-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:9px}
  .rater{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:7px}
  .rater-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .rater-name{font-weight:600;font-size:14px}
  .rater-overall{font-family:var(--font-display);font-weight:900;color:var(--burgundy);font-size:15px}
  .rater-scores{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
  .rater-notes{margin-top:7px;font-size:13px;color:var(--text);opacity:.92}

  /* attendance */
  .mchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
  .mchip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .mchip.on{background:var(--burgundy);color:#F3E9D8;border-color:var(--burgundy)}
  .who-came{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
  .who-came .names{color:var(--text)}

  /* richer ratings */
  .ratesec{font-family:var(--font-display);font-weight:700;font-size:15px;margin:18px 0 10px;color:var(--text)}
  .ratesec:first-of-type{margin-top:4px}
  .opt{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:16px;background:var(--panel-2)}
  .opt-toggle{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;cursor:pointer}
  .opt-toggle input{width:18px;height:18px;accent-color:var(--burgundy)}
  .opt-body{margin-top:12px}
  .opt-body[hidden]{display:none}
  .heatpick{display:flex;gap:6px}
  .chillidot{background:none;border:none;padding:2px;width:32px;height:32px;color:var(--line);cursor:pointer;line-height:0}
  .chillidot.on{color:var(--coriander)}
  .chillis{display:inline-flex;gap:1px;margin-left:6px;vertical-align:-3px}
  .chillis .chillidot{width:16px;height:16px;padding:0;color:var(--coriander);cursor:default}
  .wgb{display:flex;gap:8px}
  .wgb-btn{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:var(--radius-sm);padding:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .wgb-btn.on{background:var(--burgundy);color:#F3E9D8;border-color:var(--burgundy)}
  .rater-dish{font-size:13px;margin-bottom:5px}
  .rater-dish b{font-weight:600}
  .wgb-badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;margin-top:2px}
  .wgb-badge.yes{background:#E7F2DB;color:#2E5C15}
  .wgb-badge.no{background:#F7E3DD;color:#7A2317}
  .chev{color:var(--muted);flex:none;display:flex;align-items:center;transition:transform .15s ease}
  .chev.open{transform:rotate(90deg)}
  .vh-actions{display:flex;gap:14px}
  .linkbtn.danger{color:var(--chilli)}

  /* map */
  #map{height:62vh;min-height:320px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--panel-2)}
  #loc-map{height:280px;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-top:4px}
  .chilli-pin{background:none;border:none}
  .chilli-pin .pin{width:34px;height:34px;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.45))}
  .placerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .placerow:last-child{border-bottom:none}
  .mp b{font-family:var(--font-display);font-size:15px;color:#2A1A2E}
  .mp-area{color:#6b5a3a;font-size:12px}
  .mp-score{margin-top:4px;font-weight:600;color:var(--burgundy)}
  .mp-btns{margin-top:9px;display:flex;gap:14px}
  .leaflet-popup-content{margin:12px 14px}

  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* ---------- sliders ---------- */
  .slider{margin-bottom:16px}
  .slider .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .slider .top .name{font-weight:600;font-size:14px}
  .slider .top .n{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--burgundy)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}
  input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-8px;width:24px;height:24px;border-radius:50%;background:var(--turmeric);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:3px solid var(--bg);border-radius:50%;background:var(--turmeric)}

  /* ---------- dialog ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,5,12,.62);display:none;align-items:flex-end;justify-content:center;z-index:2000;padding:0}
  .scrim.show{display:flex}
  .dialog{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:var(--maxw);max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:600px){
    .scrim{align-items:center;padding:20px}
    .dialog{border-radius:20px}
  }
  .dialog .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
  .dialog h2{font-size:19px;margin-bottom:3px}
  .dialog .sub{font-size:13px;color:var(--muted);margin-bottom:16px}

  /* ---------- bottom nav ---------- */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(252,247,239,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;max-width:var(--maxw);margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav button{flex:1;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav button.active{color:var(--burgundy)}
  .nav button svg{width:22px;height:22px}

  .fab-space{height:4px}
  .center{display:flex;align-items:center;justify-content:center;min-height:62vh}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--turmeric);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none !important}

  /* auth screen */
  .auth-hero{text-align:center;padding:30px 10px 18px}
  .hero-logo{width:78px;height:78px;display:block;margin:0 auto 12px}
  .auth-hero h1{font-size:30px;font-weight:800;letter-spacing:-0.02em}
  .auth-hero p{color:var(--muted);margin-top:6px}
  .tabs{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;background:none;color:var(--muted);font-weight:700;font-size:14px;padding:9px;border-radius:99px}
  .tabs button.active{background:var(--turmeric);color:#2a1c06}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="crest" viewBox="0 0 80 80">
  <circle cx="40" cy="40" r="36" fill="none" stroke="#2A1A2E" stroke-width="2.4"/>
  <circle cx="40" cy="40" r="29.5" fill="none" stroke="#D99A2B" stroke-width="1.3"/>
  <g transform="translate(-3,3)">
    <path d="M22 52 C 27 55 35 54 42 50 C 48 46 53 41 56 35 C 58 32 58 27 55 25 C 52 27 50 30 46 34 C 41 39 34 45 29 49 C 26 51 24 52 22 52 Z" fill="#4C9E2C"/>
    <path d="M22 52 C 27 55 35 54 42 50 C 48 46 53 41 56 35 C 55 39 49 44 41 49 C 34 53 27 54 22 52 Z" fill="#2C7A18"/>
    <path d="M51 33 C 47 37 44 40 41 43 C 37 46 33 48 29 50" fill="none" stroke="#CDE89C" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 34 C 46 38 43 41 40 44 C 37 46 34 48 31 49" fill="none" stroke="#ECF7D6" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M48 30 C 50 24 55 23 58 27 C 55 30 51 31 48 30 Z" fill="#5C8E2C"/>
    <path d="M53 27 C 55 23 57 21 57 18" fill="none" stroke="#8BAD4E" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</symbol>
</defs></svg>
<div id="app" class="wrap"></div>
<div id="scrim" class="scrim" data-action="scrim-bg"><div id="dialog" class="dialog"></div></div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ==========================================================================
   Curry Club. Single static file, vanilla JS, talks to Supabase directly.
   Backend is pre-built: profiles, venues, visits, ratings, club_settings.
   Row Level Security is on. Everyone reads; you write only your own rows.
   ========================================================================== */

const SUPABASE_URL = "https://vmklxqyibmuguwzafhvg.supabase.co";
const SUPABASE_KEY = "sb_publishable_-lgK6Iji95NLHogpmT9ubA_fcmdlz4L"; // publishable key, safe in browser
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- tiny helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const app = $("#app");
const scrim = $("#scrim");
const dialog = $("#dialog");

// Escape every piece of user content before it goes into HTML.
function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
const round1 = n => n==null ? null : Math.round(n*10)/10;
function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- app state ---------- */
const state = {
  session: null,
  me: null,            // profile row for the signed-in user
  tab: "map",          // map | ranking | log
  authMode: "login",   // login | join
  loading: true,
  venues: [],
  visits: [],
  ratings: [],
  profiles: {},        // id -> display_name
  members: [],         // [{id, display_name}] for attendance chips
  attendances: [],     // who was at each visit
  expanded: null,      // venue id expanded in the ranking
};

/* ==========================================================================
   DATA
   ========================================================================== */
async function loadAll(){
  const [venues, visits, ratings, profiles, attendances] = await Promise.all([
    sb.from("venues").select("*").order("created_at",{ascending:false}),
    sb.from("visits").select("*").order("visited_on",{ascending:false}),
    sb.from("ratings").select("*"),
    sb.from("profiles").select("id,display_name"),
    sb.from("attendances").select("*"),   // empty until the migration is run
  ]);
  state.venues   = venues.data   || [];
  state.visits   = visits.data   || [];
  state.ratings  = ratings.data  || [];
  state.attendances = attendances.data || [];
  state.members  = (profiles.data || []).slice().sort((a,b)=>(a.display_name||"").localeCompare(b.display_name||""));
  state.profiles = {};
  (profiles.data || []).forEach(p => state.profiles[p.id] = p.display_name);
}

// Build the ranking: per venue, average across every rating on its visits.
const SCORE_FIELDS = [
  {key:"main",        label:"Main"},
  {key:"poppadoms",   label:"Poppadoms"},
  {key:"starter",     label:"Starter"},
  {key:"breads_rice", label:"Breads & rice"},
  {key:"dessert",     label:"Dessert"},
  {key:"service",     label:"Service"},
  {key:"value",       label:"Value"},
  {key:"ambience",    label:"Ambience"},
  {key:"portion",     label:"Portion"},
];
const CARD_FIELDS = ["main","service","value","ambience"];

function ratingScores(r){ return SCORE_FIELDS.map(f=>r[f.key]).filter(v=>typeof v==="number"); }
function ratingOverall(r){ const s=ratingScores(r); return s.length ? round1(avg(s)) : null; }

function ranking(){
  const visitsByVenue = {};
  state.visits.forEach(v => (visitsByVenue[v.venue_id] ||= []).push(v));
  const ratingsByVisit = {};
  state.ratings.forEach(r => (ratingsByVisit[r.visit_id] ||= []).push(r));

  const rows = state.venues.map(venue => {
    const vVisits = visitsByVenue[venue.id] || [];
    const rs = [];
    vVisits.forEach(vis => (ratingsByVisit[vis.id] || []).forEach(r => rs.push(r)));
    const cat = {};
    SCORE_FIELDS.forEach(f => { cat[f.key] = avg(rs.map(r=>r[f.key]).filter(v=>typeof v==="number")); });
    const overalls = rs.map(ratingOverall).filter(v=>v!=null);
    const overall = overalls.length ? avg(overalls) : null;
    return {
      venue, visitCount:vVisits.length, ratingCount:rs.length,
      cat, overall,
      lastVisit: vVisits[0]?.visited_on || null,
      visits: vVisits,
    };
  });

  // Rated venues first, by overall descending; then unrated, by newest.
  rows.sort((a,b)=>{
    if(a.overall==null && b.overall==null) return 0;
    if(a.overall==null) return 1;
    if(b.overall==null) return -1;
    return b.overall - a.overall;
  });
  return rows;
}

/* ==========================================================================
   AUTH
   ========================================================================== */
async function doLogin(email, password){
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    if(/invalid login/i.test(error.message)) throw new Error("Email or password is wrong. Try again.");
    throw new Error(error.message);
  }
}

async function doJoin(email, password, displayName, clubCode){
  const { error } = await sb.auth.signUp({
    email, password,
    options:{ data:{ display_name: displayName, club_code: clubCode } }
  });
  if(error){
    // The sign-up trigger raises on a bad club code, which Supabase returns
    // as a "Database error saving new user".
    if(/database error|unexpected_failure|club code/i.test(error.message)){
      throw new Error("That club code is wrong. Check it with whoever runs the club.");
    }
    if(/already registered|already been registered/i.test(error.message)){
      throw new Error("That email is already signed up. Try logging in instead.");
    }
    throw new Error(error.message);
  }
}

async function loadMe(){
  const uid = state.session?.user?.id;
  if(!uid){ state.me = null; return; }
  const { data } = await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
  state.me = data || { id:uid, display_name: state.session.user.email };
}

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  if(state.loading){ app.innerHTML = `<div class="center"><div class="spinner"></div></div>`; return; }
  if(!state.session){ renderAuth(); return; }
  renderApp();
}

function renderAuth(){
  const join = state.authMode === "join";
  app.innerHTML = `
    <div class="auth-hero">

function ringSVG(score){
  const pct = score==null ? 0 : Math.max(0,Math.min(1, score/10));
  const r=26, c=2*Math.PI*r, off=c*(1-pct);
  const col = score==null ? "var(--line)"
            : score>=7.5 ? "var(--coriander)"
            : score>=5   ? "var(--turmeric)" : "var(--chilli)";
  return `
    <div class="ring">
      <svg width="62" height="62" viewBox="0 0 62 62">
        <circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="6"></circle>
        <circle cx="31" cy="31" r="${r}" fill="none" stroke="${col}" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>
      </svg>
      <div class="val">
        <b>${score==null?"–":round1(score)}</b><span>/10</span>
      </div>
    </div>`;
}

function meter(label, val){
  const pct = val==null ? 0 : Math.max(0,Math.min(100, val*10));
  const col = val==null ? "var(--line)"
            : val>=7.5 ? "var(--coriander)"
            : val>=5   ? "var(--turmeric)" : "var(--chilli)";
  return `
    <div class="meter">
      <div class="lbl">${label}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="num">${val==null?"–":round1(val)}</div>
    </div>`;
}

let homeMap=null, locMap=null, locMarker=null;

function placedVenues(){ return state.venues.filter(v=> typeof v.lat==="number" && typeof v.lng==="number"); }

function chilliIcon(score){
  const col = score==null ? "#8E2B20" : score>=7.5 ? "#4C9E2C" : score>=5 ? "#D99A2B" : "#C0472E";
  return L.divIcon({ className:"chilli-pin", html:`<div class="pin" style="color:${col}">${CHILLI_SVG}</div>`, iconSize:[34,34], iconAnchor:[17,30], popupAnchor:[0,-28] });
}

function renderMap(){
  const view = $("#view");
  const overallById = {}; ranking().forEach(r=>overallById[r.venue.id]=r.overall);
  const placed = placedVenues();
  const unplaced = state.venues.filter(v=> !(typeof v.lat==="number" && typeof v.lng==="number"));
  view.innerHTML = `
    <div class="sectiontitle">The map</div>
    <div id="map"></div>
    ${placed.length ? `` : `<div class="hint" style="margin-top:12px">No venues on the map yet.${unplaced.length?" Set a location below to drop your first chilli.":" Log a visit first, then come back to place it."}</div>`}
    ${unplaced.length ? `
      <div class="sectiontitle" style="margin-top:18px">Add a location</div>
      ${unplaced.map(v=>`<div class="placerow"><span>${esc(v.name)}${v.area?` · ${esc(v.area)}`:""}</span><button class="btn secondary small" data-action="venue-location" data-id="${esc(v.id)}">Set location</button></div>`).join("")}` : ``}`;
  initHomeMap(placed, overallById);
}

function initHomeMap(placed, overallById){
  if(homeMap){ try{homeMap.remove();}catch(e){} homeMap=null; }
  const el = $("#map"); if(!el || typeof L==="undefined") return;
  homeMap = L.map(el, { scrollWheelZoom:false }).setView([51.30,-1.95], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"&copy; OpenStreetMap contributors" }).addTo(homeMap);
  const markers=[];
  placed.forEach(v=>{
    const ov = overallById[v.id];
    const m = L.marker([v.lat,v.lng], { icon: chilliIcon(ov) }).addTo(homeMap);
    m.bindPopup(`<div class="mp"><b>${esc(v.name)}</b>${v.area?`<div class="mp-area">${esc(v.area)}</div>`:``}<div class="mp-score">${ov==null?"Not rated yet":esc(ov)+" / 10"}</div><div class="mp-btns"><button class="linkbtn" data-action="open-venue" data-id="${esc(v.id)}">Open</button><button class="linkbtn" data-action="venue-location" data-id="${esc(v.id)}">Move pin</button></div></div>`);
    markers.push(m);
  });
  if(markers.length){ try{ homeMap.fitBounds(L.featureGroup(markers).getBounds().pad(0.3), { maxZoom:14 }); }catch(e){} }
  setTimeout(()=>{ try{ homeMap && homeMap.invalidateSize(); }catch(e){} }, 60);
}

function initLocMap(v){
  if(locMap){ try{locMap.remove();}catch(e){} locMap=null; }
  const el = $("#loc-map"); if(!el || typeof L==="undefined") return;
  const placed = (typeof v.lat==="number" && typeof v.lng==="number");
  const start = placed ? [v.lat,v.lng] : [51.30,-1.95];
  locMap = L.map(el).setView(start, placed?15:9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"&copy; OpenStreetMap contributors" }).addTo(locMap);

function renderRanking(){

function venueCard(r,i){
  const open = state.expanded === r.venue.id;
  const rankLabel = r.overall==null ? "–" : (i+1);
  const scored = SCORE_FIELDS.filter(f=>r.cat[f.key]!=null);
  return `
  <div class="card">
    <div class="venue" data-action="toggle-venue" data-id="${esc(r.venue.id)}">
      <div class="rank-no">${rankLabel}</div>
      ${ringSVG(r.overall)}
      <div class="body">
        <h3>${esc(r.venue.name)}</h3>
        <div class="area">${esc(r.venue.area || "")}</div>
        <div class="meta">${r.visitCount} visit${r.visitCount===1?"":"s"} · ${r.ratingCount} rating${r.ratingCount===1?"":"s"}${r.lastVisit?` · last ${esc(fmtDate(r.lastVisit))}`:""}</div>
      </div>
      <div class="chev${open?" open":""}" aria-hidden="true">${CHEVRON_SVG}</div>
    </div>
    ${open ? `
    <div class="expand">
      ${scored.length ? `
      <div class="sectiontitle" style="margin:2px 2px 8px">Scores</div>
      <div class="meters" style="margin-top:0">
        ${scored.map(f=>meter(f.label, r.cat[f.key])).join("")}
      </div>` : `<div class="hint">No scores yet. Rate a visit to start the board.</div>`}
      ${r.visits.length ? r.visits.map(v=>{
        const rs = ratingsForVisit(v.id);
        const mine = rs.find(x=>x.isMe);
        return `
        <div class="visit-block">
          <div class="visit-head">
            <span>${esc(fmtDate(v.visited_on))}</span>
            <span class="vh-actions">
              <button class="linkbtn" data-action="rate" data-visit="${esc(v.id)}" data-venue="${esc(r.venue.name)}">${mine?"edit your rating":"rate this visit"}</button>
              <button class="linkbtn danger" data-action="delete-visit" data-visit="${esc(v.id)}">delete</button>
            </span>
          </div>
          ${rs.length ? rs.map(raterBlock).join("") : `<div class="hint">No ratings yet. Be the first.</div>`}
          ${whoCameLine(v.id, r.venue.name)}
        </div>`;
      }).join("") : `<div class="hint">No visits logged yet.</div>`}
    </div>` : ``}
  </div>`;
}

function raterBlock(x){
  const chip = (label,v)=> (typeof v==="number") ? `<span class="chip">${label} ${v}</span>` : "";
  const dishLine = (label,dish,heat)=> dish ? `<div class="rater-dish">${label}: <b>${esc(dish)}</b>${heatChillies(heat)}</div>` : "";
  const wgb = x.would_go_back===true ? `<span class="wgb-badge yes">Would go back</span>`
            : x.would_go_back===false ? `<span class="wgb-badge no">Would not return</span>` : "";
  return `
    <div class="rater">
      <div class="rater-top">
        <span class="rater-name">${esc(x.name)}${x.isMe?" (you)":""}</span>
        <span class="rater-overall">${x.overall==null?"–":x.overall}/10</span>
      </div>
      ${dishLine("Main", x.main_dish, x.main_heat)}
      ${dishLine("Starter", x.starter_dish, x.starter_heat)}
      ${x.dessert_dish?`<div class="rater-dish">Dessert: <b>${esc(x.dessert_dish)}</b></div>`:``}
      <div class="rater-scores">${SCORE_FIELDS.map(f=>chip(f.label, x[f.key])).join("")}</div>
      ${wgb}
      ${x.notes?`<div class="rater-notes">${esc(x.notes)}</div>`:``}
    </div>`;
}

function myRatingFor(visitId){
  const uid = state.session?.user?.id;
  const r = state.ratings.find(x=>x.visit_id===visitId && x.user_id===uid);
  if(!r) return null;
  return round1(avg([r.food,r.service,r.value]));
}

// Everyone's ratings for a visit, with display names, newest-best first.
function ratingsForVisit(visitId){
  const uid = state.session?.user?.id;
  return state.ratings
    .filter(r=>r.visit_id===visitId)
    .map(r=>({
      ...r,
      name: state.profiles[r.user_id] || "Someone",
      isMe: r.user_id===uid,
      overall: ratingOverall(r),
    }))
    .sort((a,b)=>(b.overall||0)-(a.overall||0));
}

// Attendance helpers.
function attendeeIdsForVisit(visitId){

function attendeesForVisit(visitId){

function memberChips(selectedIds){
  const sel = new Set((selectedIds||[]).filter(Boolean));
  if(!state.members.length) return `<div class="hint">No members have signed up yet.</div>`;

  ).join("") + `</div>`;
}
function whoCameLine(visitId, venueName){
  const names = attendeesForVisit(visitId);
  const list = names.length
    ? `<span>Who came:</span> <span class="names">${names.map(esc).join(", ")}</span>`

const CHILLI_SVG = `<svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M6 20 C10 21 15 18 19 12 C21 9 21 6 20 5 C19 7 18 9 14 13 C10 17 8 18 6 20 Z" fill="currentColor"/><path d="M19 5 C20 3 21 3 22 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const CHEVRON_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;

function heatChillies(n){
  if(!n) return "";
  let s = `<span class="chillis">`;
  for(let i=0;i<n;i++) s += `<span class="chillidot on">${CHILLI_SVG}</span>`;
  return s + `</span>`;
}

function heatPicker(key, value){
  const v = value || 0;
  return `<div class="heatpick" data-key="${key}" data-value="${v}">` +
    [1,2,3,4,5].map(n=>`<button type="button" class="chillidot${v>=n?" on":""}" data-action="set-heat" data-key="${key}" data-level="${n}" aria-label="${n} ${n===1?"chilli":"chillies"}">${CHILLI_SVG}</button>`).join("") +
    `</div>`;
}

function wgbPicker(value){
  const yes = value===true, no = value===false;
  return `<div class="wgb" data-value="${yes?"yes":no?"no":""}">
    <button type="button" class="wgb-btn${yes?" on":""}" data-action="set-wgb" data-val="yes">Yes</button>
    <button type="button" class="wgb-btn${no?" on":""}" data-action="set-wgb" data-val="no">No</button>
  </div>`;
}

function optCourse(key,label,active,r){
  const hasDish = key==="starter" || key==="dessert";
  const hasHeat = key==="starter";
  const toggleLabel = key==="breads_rice" ? "Had breads and rice" : `Had a ${label.toLowerCase()}`;
  const body = `
    ${hasDish?`<div class="field"><label for="dish-${key}">${label}: what you had <span style="font-weight:400">(optional)</span></label><input id="dish-${key}" type="text" placeholder="Optional" value="${esc(r[key+"_dish"]||"")}"></div>`:``}
    ${hasHeat?`<div class="field"><label>${label}: heat</label>${heatPicker(key, r[key+"_heat"])}</div>`:``}
    ${slider(key, label+" score", typeof r[key]==="number"?r[key]:6)}`;
  return `<div class="opt">
    <label class="opt-toggle"><input type="checkbox" data-action="toggle-course" data-course="${key}" ${active?"checked":""}> ${toggleLabel}</label>
    <div class="opt-body" data-course-body="${key}" ${active?"":"hidden"}>${body}</div>
  </div>`;
}

function wireSliders(){
  dialog.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const t = $(`#num-${e.target.dataset.key}`);
      if(t) t.textContent = e.target.value;
    });
  });
}

function slider(key,label,val){
  return `
  <div class="slider">
    <div class="top"><span class="name">${label}</span><span class="n" id="num-${key}">${val}</span></div>
    <input type="range" min="1" max="10" step="1" value="${val}" data-key="${key}">
  </div>`;
}

}

/* ---------- messages ---------- */
function showMsg(id, text, kind="error"){
  const el = $("#"+id); if(!el) return;
  el.textContent = text;
  el.className = `msg ${kind} show`;
}
function clearMsg(id){ const el=$("#"+id); if(el){ el.className="msg"; el.textContent=""; } }

/* ==========================================================================
   ACTIONS (event delegation via data-action)
   ========================================================================== */
document.addEventListener("click", async (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;

  if(action==="auth-tab"){ state.authMode = t.dataset.mode; renderAuth(); }

  if(action==="scrim-bg" && e.target===scrim) closeDialog();
  if(action==="close-dialog") closeDialog();

  if(action==="tab"){ state.tab = t.dataset.tab; state.expanded=null; renderApp(); }

  if(action==="logout"){
    await sb.auth.signOut();
  }

  if(action==="toggle-venue"){
    const id = t.dataset.id;
    state.expanded = state.expanded===id ? null : id;
    renderRanking();
  }

  if(action==="delete-visit"){
    if(!confirm("Delete this visit, along with its ratings and attendance? This cannot be undone.")) return;
    const { error } = await sb.from("visits").delete().eq("id", t.dataset.visit);
    if(error){ alert(error.message); return; }
    await loadAll();
    if(state.visits.some(v=>v.id===t.dataset.visit)) alert("Only whoever logged this visit can delete it.");
    renderApp();
  }

  if(action==="rate"){
    const visitId = t.dataset.visit;
    const existing = currentRating(visitId);
    openRating(visitId, t.dataset.venue, existing);
  }

  if(action==="rate-latest"){
    const venueId = t.dataset.venueId;
    const vs = state.visits.filter(v=>v.venue_id===venueId)
      .sort((a,b)=> (b.visited_on||"").localeCompare(a.visited_on||""));
    if(!vs.length) return;
    const visit = vs[0];
    const venue = state.venues.find(v=>v.id===venueId);
    openRating(visit.id, venue?.name, currentRating(visit.id));
  }

  if(action==="toggle-attendee"){ t.classList.toggle("on"); }

  if(action==="edit-attendance"){
    openAttendance(t.dataset.visit, t.dataset.venue);
  }

  if(action==="open-venue"){
    state.tab = "ranking"; state.expanded = t.dataset.id; renderApp();
  }

  if(action==="venue-location"){
    openVenueLocation(t.dataset.id);
  }

  if(action==="geocode"){
    const q = ($("#loc-q").value || "").trim(); if(!q) return;
    clearMsg("loc-msg");
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q=${encodeURIComponent(q)}`, { headers:{ "Accept":"application/json" } });
      const data = await res.json();
      if(!data || !data.length){ showMsg("loc-msg","Could not find that. Try a postcode or a nearby town.","error"); return; }
      const lat=+data[0].lat, lng=+data[0].lon;
      if(locMap){ locMap.setView([lat,lng],15); locMarker.setLatLng([lat,lng]); }
    }catch(e){ showMsg("loc-msg","Lookup failed. Drag the pin by hand instead.","error"); }
  }

  if(action==="save-location"){
    if(!locMarker) return;
    const ll = locMarker.getLatLng();
    const { error } = await sb.from("venues").update({ lat: ll.lat, lng: ll.lng }).eq("id", t.dataset.id);
    if(error){ showMsg("loc-msg", error.message, "error"); return; }
    closeDialog();
    await loadAll();
    const v = state.venues.find(x=>x.id===t.dataset.id);
    if(!(v && typeof v.lat==="number")) alert("Only whoever added this venue can set its location.");
    renderApp();
  }

  if(action==="set-heat"){
    const wrap = t.closest(".heatpick"); if(!wrap) return;
    const lvl = +t.dataset.level, cur = +wrap.dataset.value;
    const next = cur===lvl ? 0 : lvl;
    wrap.dataset.value = next;
    wrap.querySelectorAll(".chillidot").forEach((c,i)=>c.classList.toggle("on", i<next));
  }

  if(action==="set-wgb"){
    const wrap = t.closest(".wgb"); if(!wrap) return;
    wrap.dataset.value = t.dataset.val;
    wrap.querySelectorAll(".wgb-btn").forEach(b=>b.classList.toggle("on", b.dataset.val===t.dataset.val));
  }
});

document.addEventListener("change", (e)=>{
  if(e.target.id==="l-venue") toggleNewVenue();
  if(e.target.dataset && e.target.dataset.action==="toggle-course"){
    const body = dialog.querySelector(`.opt-body[data-course-body="${e.target.dataset.course}"]`);
    if(body) body.hidden = !e.target.checked;
  }
});

document.addEventListener("submit", async (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  e.preventDefault();
  const action = t.dataset.action;

  if(action==="auth-submit") return handleAuth();
  if(action==="log-submit") return handleLog();
  if(action==="rating-submit") return handleRating(t.dataset.visit);
  if(action==="attendance-submit") return handleAttendance(t.dataset.visit);
});

function currentRating(visitId){
  const uid = state.session?.user?.id;
  return state.ratings.find(x=>x.visit_id===visitId && x.user_id===uid) || null;
}

async function handleAuth(){
  clearMsg("auth-msg");
  const go = $("#auth-go"); go.disabled = true;
  const join = state.authMode==="join";
  const email = $("#f-email").value.trim();
  const pass = $("#f-pass").value;
  try{
    if(join){
      const name = $("#f-name").value.trim();
      const code = $("#f-code").value.trim();
      if(!name) throw new Error("Add your name so the club knows who you are.");
      if(pass.length < 6) throw new Error("Password needs at least 6 characters.");
      await doJoin(email, pass, name, code);
      // Email confirmation is off, so a session should exist now.
      await afterAuthChange();
      if(!state.session){
        state.authMode="login"; renderAuth();
        showMsg("auth-msg","Account made. Log in with your email and password.","ok");
      }
    } else {
      await doLogin(email, pass);
    }
  }catch(err){
    showMsg("auth-msg", err.message);
    const g=$("#auth-go"); if(g) g.disabled=false;
  }
}

async function handleLog(){
  clearMsg("log-msg");
  const go = $("#log-go"); go.disabled = true;
  try{
    const sel = $("#l-venue");
    const date = $("#l-date").value || todayISO();
    let venueId = sel.value;
    let venueName = "";

    if(!venueId){
      const name = $("#l-name").value.trim();
      const area = $("#l-area").value.trim();
      if(!name) throw new Error("Give the venue a name.");
      const { data, error } = await sb.from("venues")
        .insert({ name, area: area || null }).select().single();
      if(error) throw new Error(error.message);
      venueId = data.id; venueName = data.name;
    } else {
      venueName = state.venues.find(v=>v.id===venueId)?.name || "";
    }

    const { data: visit, error: vErr } = await sb.from("visits")
      .insert({ venue_id: venueId, visited_on: date }).select().single();
    if(vErr) throw new Error(vErr.message);

    // Attendance: who was ticked. Errors are ignored so a missing table never blocks logging.
    const attendeeIds = [...document.querySelectorAll('#log-attendees .mchip.on')].map(b=>b.dataset.id);
    if(attendeeIds.length){
      await sb.from("attendances").upsert(
        attendeeIds.map(id=>({ visit_id: visit.id, member_id: id })),
        { onConflict: "visit_id,member_id", ignoreDuplicates: true }
      );
    }

    await loadAll();
    state.tab = "ranking";
    renderApp();
    openRating(visit.id, venueName, null);
  }catch(err){
    showMsg("log-msg", err.message, "error");
    const g=$("#log-go"); if(g) g.disabled=false;
  }
}

async function handleAttendance(visitId){
  clearMsg("att-msg");
  const go = $("#att-go"); if(go) go.disabled = true;
  try{
    const selected = new Set([...document.querySelectorAll('#att-chips .mchip.on')].map(b=>b.dataset.id));
    const before = new Set(attendeeIdsForVisit(visitId));
    const toAdd = [...selected].filter(id=>!before.has(id));
    const toRemove = [...before].filter(id=>!selected.has(id));
    if(toAdd.length){
      const { error } = await sb.from("attendances")
        .insert(toAdd.map(id=>({ visit_id: visitId, member_id: id })));
      if(error) throw new Error(error.message);
    }
    if(toRemove.length){
      const { error } = await sb.from("attendances")
        .delete().eq("visit_id", visitId).in("member_id", toRemove);
      if(error) throw new Error(error.message);
    }
    await loadAll();
    closeDialog();
    renderApp();
  }catch(err){
    showMsg("att-msg", err.message);
    const g=$("#att-go"); if(g) g.disabled=false;
  }
}

async function handleRating(visitId){
  clearMsg("rate-msg");
  const go = $("#rate-go"); if(go) go.disabled = true;
  try{
    const slV = k => { const el = dialog.querySelector(`input[type=range][data-key="${k}"]`); return el ? parseInt(el.value,10) : null; };
    const heatV = k => { const w = dialog.querySelector(`.heatpick[data-key="${k}"]`); const v = w ? +w.dataset.value : 0; return v || null; };
    const dishV = id => { const el = $("#"+id); const t = el ? el.value.trim() : ""; return t || null; };
    const courseOn = k => { const el = dialog.querySelector(`input[data-course="${k}"]`); return !!(el && el.checked); };
    const wgbEl = dialog.querySelector(".wgb"); const wgb = wgbEl ? wgbEl.dataset.value : "";
    const payload = {
      visit_id: visitId,
      poppadoms: slV("poppadoms"),
      main: slV("main"), main_dish: dishV("dish-main"), main_heat: heatV("main"),
      starter:      courseOn("starter")     ? slV("starter")        : null,
      starter_dish: courseOn("starter")     ? dishV("dish-starter") : null,
      starter_heat: courseOn("starter")     ? heatV("starter")      : null,
      breads_rice:  courseOn("breads_rice") ? slV("breads_rice")    : null,
      dessert:      courseOn("dessert")     ? slV("dessert")        : null,
      dessert_dish: courseOn("dessert")     ? dishV("dish-dessert") : null,
      service: slV("service"), value: slV("value"),
      ambience: slV("ambience"), portion: slV("portion"),
      would_go_back: wgb==="yes" ? true : wgb==="no" ? false : null,
      notes: ($("#r-notes").value || "").trim() || null,
    };
    const { error } = await sb.from("ratings")
      .upsert(payload, { onConflict: "visit_id,user_id" });
    if(error) throw new Error(error.message);
    await loadAll();
    closeDialog();
    state.tab = "ranking";
    renderApp();
  }catch(err){
    showMsg("rate-msg", err.message, "error");
    const g=$("#rate-go"); if(g) g.disabled=false;
  }
}

/* ==========================================================================
   BOOT
   ========================================================================== */
async function afterAuthChange(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if(state.session){
    await loadMe();
    await loadAll();
  }
}

async function boot(){
  await afterAuthChange();
  state.loading = false;
  render();
}

sb.auth.onAuthStateChange((_event, session)=>{
  const was = !!state.session;
  state.session = session;
  if(session && !was){
    state.loading = true; render();
    (async()=>{ await loadMe(); await loadAll(); state.loading=false; state.tab="ranking"; render(); })();
  } else if(!session){
    state.me=null; state.venues=[]; state.visits=[]; state.ratings=[]; render();
  }
});

boot();
</script>
